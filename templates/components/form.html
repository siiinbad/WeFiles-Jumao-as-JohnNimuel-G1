{% load ui %}
{% if form.non_field_errors %}<div class="notice notice-error" role="alert">{% icon 'info' %}<div>{{ form.non_field_errors }}</div></div>{% endif %}
{% for field in form %}<div class="field">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="required-mark" aria-hidden="true"> *</span>{% endif %}</label>
  {% input_field field %}
  {% if field.help_text %}<div class="field-help" id="{{ field.auto_id }}_help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="field-errors" id="{{ field.auto_id }}_errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>{% endfor %}
